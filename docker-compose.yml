services:
  db:
    image: postgres:18-alpine
    container_name: live-chat-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-livechat}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:7689:5432"

  app:
    build: .
    container_name: live-chat-app
    ports:
      - "9822:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-livechat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-livechat}?disable_ssl=true
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
