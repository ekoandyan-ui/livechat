services:
  db:
    image: postgres:18-alpine
    container_name: live-chat-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-livechat}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:7689:5432"

  redis:
    image: redis:7-alpine
    container_name: live-chat-redis
    command: redis-server --appendonly yes --requirepass ${LIVECHAT_REDIS_PASSWORD:-livechat_redis_2026}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${LIVECHAT_REDIS_PASSWORD:-livechat_redis_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:7789:6379"

  app:
    build: .
    container_name: live-chat-app
    ports:
      - "9822:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-livechat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-livechat}?disable_ssl=true
      DATABASE_SSL: "false"
      NODE_ENV: ${NODE_ENV:-production}
      # Default ke redis internal compose; bisa di-override via .env (REDIS_URL)
      # untuk pakai Redis eksternal/managed. Kosongkan untuk fallback PG sessions.
      REDIS_URL: ${REDIS_URL:-redis://:${LIVECHAT_REDIS_PASSWORD:-livechat_redis_2026}@redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
